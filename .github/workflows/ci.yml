name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and schema tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:schema
      - run: npm run test:hints
